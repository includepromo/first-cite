<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <title>My May</title>
  <link rel="stylesheet" href="style.css">
  <style>
    /* Дополнительные стили для галереи */
    .gallery-content {
      position: relative;
      z-index: 10;                    /* выше фона */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 20px;
      color: #c8d9e6;
      font-family: 'Courier New', monospace;
      text-align: center;
    }

    h1 {
      font-size: 2.5rem;
      text-shadow: 0 0 15px rgba(139, 179, 207, 0.4);
      margin-bottom: 40px;
    }

    .gallery {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 30px;
      max-width: 1200px;
    }

    .card {
      background: rgba(30, 45, 61, 0.7);
      border-radius: 18px;
      padding: 12px;
      backdrop-filter: blur(10px);
      border: 1px solid #4a6274;
      transition: transform 0.2s, box-shadow 0.3s;
    }

    .card:hover {
      transform: scale(1.03);
      box-shadow: 0 8px 25px rgba(139, 179, 207, 0.3);
    }

    .card img {
      display: block;
      width: 320px;
      height: 240px;
      object-fit: cover;
      border-radius: 12px;
    }

    .back-btn {
      margin-top: 40px;
      background: rgba(30, 45, 61, 0.85);
      border: 1px solid #4a6274;
      color: #c8d9e6;
      padding: 10px 28px;
      border-radius: 14px;
      font-family: "Courier New", monospace;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 0.1rem;
      cursor: pointer;
      backdrop-filter: blur(4px);
      transition: background 0.3s, box-shadow 0.3s;
    }

    .back-btn:hover {
      background: rgba(59, 83, 107, 0.9);
      box-shadow: 0 0 12px rgba(139, 179, 207, 0.4);
    }
  </style>
</head>
<body>
  <!-- Фоновые кружочки (canvas) будут вставлены скриптом первыми -->
  <script src="JS/background.js"></script>

  <div class="gallery-content">
    <h1>🔥</h1>
    <div class="gallery">
      <div class="card"><img src="Photo/photo_1.jpg" alt="Шашлык 1"></div>
      <div class="card"><img src="Photo/photo_2.jpg" alt="Шашлык 2"></div>
      <div class="card"><img src="Photo/photo_3.jpg" alt="Шашлык 3"></div>
    </div>
    <button class="back-btn" onclick="window.location.href='index.html'">← Назад</button>
  </div>
</body>
</html>
